<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Clean-Room Architecture for Testable Canvas Games</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        background: #0b0d13;
        color: #c9d1d9;
        font-family: system-ui, sans-serif;
      }
      canvas {
        display: block;
        background: #12141c;
        border-radius: 8px;
        max-width: 100vw;
      }
      #hud {
        font-variant-numeric: tabular-nums;
        color: #4cc9f0;
      }
      p {
        margin: 0;
        color: #6b7280;
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <main>
      <canvas id="game"></canvas>
    </main>
    <span id="hud">seed — • score — • tick — • hash —</span>
    <p>Use arrow keys or WASD to move the ball, touch orbs.</p>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
